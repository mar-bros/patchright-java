name: Patchright Build & Test

on:
  # push:
  #   branches:
  #     - main
  # pull_request:
  #   branches:
  #     - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          java-version: '1.8'
          distribution: 'temurin'
          cache: 'maven'

      # PLAYWRIGHT 1.63+ ASSEMBLES THE DRIVER WITH npm
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Build and Patch Sources
        run: bash scripts/build.sh

      - name: Run Playwright Test Suite
        run: bash scripts/test_patchright.sh
